<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThinkDet Architecture</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fff;
    font-family: 'Helvetica Neue', 'Arial', sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 20px;
  }
</style>
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" width="1020" height="560">
  <defs>
    <marker id="a" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto"><path d="M0,0 L6,2 L0,4Z" fill="#374151"/></marker>
    <marker id="ao" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto"><path d="M0,0 L6,2 L0,4Z" fill="#92400e"/></marker>
    <marker id="ag" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto"><path d="M0,0 L6,2 L0,4Z" fill="#166534"/></marker>
    <marker id="ab" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto"><path d="M0,0 L6,2 L0,4Z" fill="#1d4ed8"/></marker>
  </defs>

  <rect width="1020" height="560" fill="#fff"/>

  <!-- ================================================================ -->
  <!-- BLOCK 1: MLLM -->
  <!-- ================================================================ -->
  <rect x="14" y="30" width="180" height="380" rx="3" fill="#fff" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="104" y="48" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a8a">Block 1: MLLM</text>

  <!-- Vision Encoder (MLLM) — bottom -->
  <rect x="34" y="340" width="140" height="34" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="104" y="358" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1e3a8a">Vision Encoder</text>
  <text x="104" y="370" text-anchor="middle" font-size="7.5" fill="#60a5fa">(MLLM)</text>
  <text x="160" y="352" font-size="8" fill="#93c5fd">&#10052;</text>

  <!-- arrow up -->
  <line x1="104" y1="340" x2="104" y2="316" stroke="#374151" stroke-width="1" marker-end="url(#a)"/>

  <!-- LLM Decoder -->
  <rect x="34" y="278" width="140" height="34" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="104" y="294" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1e3a8a">LLM Decoder</text>
  <text x="104" y="306" text-anchor="middle" font-size="7.5" fill="#60a5fa">InternLM2</text>
  <text x="160" y="290" font-size="8" fill="#93c5fd">&#10052;</text>

  <!-- Hidden State H -->
  <text x="104" y="272" text-anchor="middle" font-size="7.5" fill="#6b7280" font-style="italic">Hidden State H</text>

  <!-- arrow up -->
  <line x1="104" y1="264" x2="104" y2="244" stroke="#374151" stroke-width="1" marker-end="url(#a)"/>

  <!-- Layer 9 Output -->
  <rect x="34" y="210" width="140" height="30" rx="3" fill="#fef9c3" stroke="#eab308" stroke-width="1.1"/>
  <text x="104" y="229" text-anchor="middle" font-size="9.5" font-weight="700" fill="#854d0e">Layer 9 Output</text>

  <!-- arrow up -->
  <line x1="104" y1="210" x2="104" y2="190" stroke="#92400e" stroke-width="1" marker-end="url(#ao)"/>

  <!-- Stage 1,2,3 badge -->
  <rect x="34" y="62" width="52" height="14" rx="2" fill="#dc2626"/>
  <text x="60" y="73" text-anchor="middle" font-size="7.5" font-weight="700" fill="#fff">Stage 1,2,3</text>

  <!-- Projector -->
  <rect x="34" y="78" width="108" height="30" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.1"/>
  <text x="88" y="97" text-anchor="middle" font-size="9.5" font-weight="600" fill="#92400e">Projector</text>
  <text x="130" y="93" font-size="8" fill="#d97706">&#128293;</text>

  <!-- arrow down from projector to layer9 area -->
  <line x1="88" y1="108" x2="88" y2="126" stroke="#92400e" stroke-width="1" marker-end="url(#ao)"/>

  <!-- adaption prompt label going right -->
  <line x1="142" y1="93" x2="194" y2="93" stroke="#92400e" stroke-width="1.2" marker-end="url(#ao)"/>
  <text x="168" y="87" text-anchor="middle" font-size="7" fill="#92400e" font-style="italic">Adaption</text>
  <text x="168" y="106" text-anchor="middle" font-size="7" fill="#92400e" font-style="italic">prompt A<tspan font-size="5.5" baseline-shift="sub">p</tspan></text>

  <!-- small image + text at very bottom -->
  <rect x="42" y="388" width="40" height="30" rx="2" fill="#f3f4f6" stroke="#d1d5db" stroke-width="0.6"/>
  <text x="62" y="407" text-anchor="middle" font-size="7" fill="#6b7280">Image</text>
  <text x="140" y="407" text-anchor="middle" font-size="7.5" fill="#6b7280" font-style="italic">Text Query</text>

  <!-- arrows up from image/text to vision encoder -->
  <line x1="62" y1="388" x2="80" y2="374" stroke="#9ca3af" stroke-width="0.7" marker-end="url(#a)"/>
  <line x1="140" y1="400" x2="130" y2="374" stroke="#9ca3af" stroke-width="0.7" marker-end="url(#a)"/>

  <!-- ================================================================ -->
  <!-- BLOCK 2: Detector -->
  <!-- ================================================================ -->
  <rect x="205" y="10" width="310" height="410" rx="3" fill="#fff" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="360" y="28" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a8a">Block 2: Detector</text>

  <!-- Classification Loss -->
  <rect x="228" y="40" width="100" height="34" rx="3" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.9"/>
  <text x="278" y="55" text-anchor="middle" font-size="8.5" font-weight="600" fill="#991b1b">Classification</text>
  <text x="278" y="66" text-anchor="middle" font-size="8.5" font-weight="600" fill="#991b1b">Loss</text>

  <!-- Localization Loss -->
  <rect x="348" y="40" width="100" height="34" rx="3" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.9"/>
  <text x="398" y="55" text-anchor="middle" font-size="8.5" font-weight="600" fill="#991b1b">Localization</text>
  <text x="398" y="66" text-anchor="middle" font-size="8.5" font-weight="600" fill="#991b1b">Loss</text>

  <!-- Stage 3 badge -->
  <rect x="228" y="96" width="44" height="14" rx="2" fill="#dc2626"/>
  <text x="250" y="107" text-anchor="middle" font-size="7" font-weight="700" fill="#fff">Stage 3</text>

  <!-- Adapter -->
  <rect x="228" y="112" width="100" height="30" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.1"/>
  <text x="278" y="131" text-anchor="middle" font-size="9.5" font-weight="600" fill="#92400e">Adapter</text>
  <text x="316" y="127" font-size="8" fill="#d97706">&#128293;</text>

  <!-- arrow right from adapter to detector decoder -->
  <line x1="328" y1="127" x2="358" y2="127" stroke="#92400e" stroke-width="1" marker-end="url(#ao)"/>
  <text x="343" y="120" text-anchor="middle" font-size="7" fill="#92400e" font-style="italic">A<tspan font-size="5.5" baseline-shift="sub">p</tspan></text>

  <!-- Detector Decoder -->
  <rect x="362" y="108" width="138" height="40" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="431" y="126" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1e3a8a">Detector Decoder</text>
  <text x="431" y="140" text-anchor="middle" font-size="7.5" fill="#60a5fa">6-Layer Transformer</text>
  <text x="488" y="122" font-size="8" fill="#93c5fd">&#10052;</text>

  <!-- arrows from decoder up to losses -->
  <line x1="400" y1="108" x2="320" y2="74" stroke="#374151" stroke-width="0.8" marker-end="url(#a)"/>
  <line x1="440" y1="108" x2="410" y2="74" stroke="#374151" stroke-width="0.8" marker-end="url(#a)"/>

  <!-- Vision Encoder (Detector) -->
  <rect x="228" y="230" width="120" height="34" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="288" y="248" text-anchor="middle" font-size="9" font-weight="600" fill="#1e3a8a">Vision Encoder</text>
  <text x="288" y="260" text-anchor="middle" font-size="7.5" fill="#60a5fa">(Detector)</text>

  <!-- Text Encoder -->
  <rect x="368" y="230" width="120" height="34" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="428" y="248" text-anchor="middle" font-size="9" font-weight="600" fill="#1e3a8a">Text Encoder</text>
  <text x="428" y="260" text-anchor="middle" font-size="7.5" fill="#60a5fa">(BERT)</text>

  <!-- labels above encoders -->
  <text x="288" y="222" text-anchor="middle" font-size="7" fill="#9ca3af">Image Embedding E<tspan font-size="5" baseline-shift="sub">VD</tspan></text>
  <text x="428" y="222" text-anchor="middle" font-size="7" fill="#9ca3af">Text Embedding</text>

  <!-- arrows up from encoders -->
  <line x1="288" y1="218" x2="288" y2="200" stroke="#374151" stroke-width="0.8"/>
  <line x1="428" y1="218" x2="428" y2="200" stroke="#374151" stroke-width="0.8"/>

  <!-- arrows from encoder area up to decoder -->
  <path d="M 288 196 L 288 180 L 400 156 L 400 148" stroke="#374151" stroke-width="0.8" fill="none" marker-end="url(#a)"/>
  <path d="M 428 196 L 428 180 L 440 160 L 440 148" stroke="#374151" stroke-width="0.8" fill="none" marker-end="url(#a)"/>

  <!-- Image box -->
  <rect x="252" y="290" width="48" height="34" rx="2" fill="#f3f4f6" stroke="#d1d5db" stroke-width="0.7"/>
  <text x="276" y="311" text-anchor="middle" font-size="7.5" fill="#6b7280">Image</text>

  <!-- arrows up from image to vision encoder -->
  <line x1="276" y1="290" x2="282" y2="264" stroke="#9ca3af" stroke-width="0.7" marker-end="url(#a)"/>

  <!-- Text query -->
  <text x="418" y="310" text-anchor="middle" font-size="8" fill="#374151" font-style="italic">"something to talk on"</text>
  <line x1="418" y1="302" x2="428" y2="264" stroke="#9ca3af" stroke-width="0.7" marker-end="url(#a)"/>

  <!-- ================================================================ -->
  <!-- BLOCK 3: Zero-Initialized Cross-Attention -->
  <!-- ================================================================ -->
  <rect x="530" y="30" width="476" height="440" rx="3" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/>
  <text x="720" y="50" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991b1b">Block 3: Zero-Initialized Cross-Attention</text>
  <rect x="928" y="36" width="44" height="14" rx="2" fill="#dc2626"/>
  <text x="950" y="47" text-anchor="middle" font-size="7" font-weight="700" fill="#fff">Stage 3</text>

  <!-- ---- TOP: Decoder Layer out ---- -->
  <rect x="568" y="68" width="140" height="30" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="638" y="87" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1e3a8a">Decoder Layer</text>
  <text x="698" y="80" font-size="8" fill="#93c5fd">&#10052;</text>

  <!-- Plus circle -->
  <circle cx="610" cy="126" r="13" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="610" y="131" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">+</text>

  <!-- arrow from decoder layer down-left to plus -->
  <line x1="620" y1="98" x2="614" y2="113" stroke="#374151" stroke-width="1" marker-end="url(#a)"/>

  <!-- E_T label -->
  <text x="636" y="122" text-anchor="start" font-size="9" fill="#374151" font-style="italic">E<tspan font-size="6" baseline-shift="sub">T</tspan></text>

  <!-- Zero Initialized Gating -->
  <rect x="810" y="98" width="140" height="34" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.1"/>
  <text x="880" y="114" text-anchor="middle" font-size="9.5" font-weight="600" fill="#92400e">Zero Initialized</text>
  <text x="880" y="126" text-anchor="middle" font-size="9.5" font-weight="600" fill="#92400e">Gating</text>
  <text x="938" y="112" font-size="8" fill="#d97706">&#128293;</text>

  <!-- arrow left from gating to plus -->
  <line x1="810" y1="115" x2="623" y2="122" stroke="#166534" stroke-width="1.2" marker-end="url(#ag)"/>

  <!-- arrow up from cross-attn to gating -->
  <line x1="880" y1="188" x2="880" y2="132" stroke="#92400e" stroke-width="1" marker-end="url(#ao)"/>

  <!-- Cross-Attention -->
  <rect x="790" y="190" width="170" height="38" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.1"/>
  <text x="875" y="209" text-anchor="middle" font-size="9.5" font-weight="600" fill="#92400e">Cross-Attention</text>
  <text x="875" y="222" text-anchor="middle" font-size="7.5" fill="#b45309">memory attends to A<tspan font-size="5.5" baseline-shift="sub">p</tspan></text>
  <text x="948" y="206" font-size="8" fill="#d97706">&#128293;</text>

  <!-- Q label -->
  <text x="780" y="213" text-anchor="end" font-size="9" font-weight="600" fill="#374151">Q</text>

  <!-- K,V label -->
  <text x="960" y="250" text-anchor="start" font-size="9" font-weight="600" fill="#374151">K, V</text>

  <!-- ---- MIDDLE ROW: Embedding + Adaption Prompt ---- -->
  <rect x="580" y="290" width="140" height="30" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="650" y="309" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1e3a8a">Embedding</text>

  <rect x="810" y="290" width="140" height="30" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="880" y="309" text-anchor="middle" font-size="9.5" font-weight="600" fill="#92400e">Adaption Prompt</text>

  <!-- arrows up from middle row to cross-attn -->
  <path d="M 650 290 L 650 240 L 790 210" stroke="#374151" stroke-width="0.9" fill="none" marker-end="url(#a)"/>
  <path d="M 880 290 L 880 252 L 960 252 L 960 228" stroke="#92400e" stroke-width="0.9" fill="none" marker-end="url(#ao)"/>

  <!-- ---- BOTTOM ROW: Decoder Layer in + Adaption Prompt ---- -->
  <rect x="580" y="360" width="140" height="30" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="650" y="379" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1e3a8a">Decoder Layer</text>
  <text x="710" y="372" font-size="8" fill="#93c5fd">&#10052;</text>

  <rect x="810" y="360" width="140" height="30" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="880" y="379" text-anchor="middle" font-size="9.5" font-weight="600" fill="#92400e">Adaption Prompt</text>

  <!-- arrows up from bottom row to middle row -->
  <line x1="650" y1="360" x2="650" y2="320" stroke="#374151" stroke-width="0.9" marker-end="url(#a)"/>
  <line x1="880" y1="360" x2="880" y2="320" stroke="#92400e" stroke-width="0.9" marker-end="url(#ao)"/>

  <!-- Curved arrow from plus back to top decoder layer -->
  <path d="M 597" y1="126" d="M 597 126 L 570 126 L 570 83 L 568 83" stroke="#166534" stroke-width="1.2" fill="none" marker-end="url(#ag)"/>

  <!-- ---- Equation box ---- -->
  <rect x="570" y="420" width="380" height="34" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
  <text x="760" y="442" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d" font-family="'Times New Roman', Georgia, serif">memory' = memory + &#916;<tspan font-size="9" baseline-shift="sub">semantic</tspan></text>

  <!-- ================================================================ -->
  <!-- CONNECTING ARROWS between blocks -->
  <!-- ================================================================ -->

  <!-- Block 1 projector → Block 2 adapter -->
  <path d="M 194 93 L 205 93 L 205 127 L 228 127" stroke="#92400e" stroke-width="1.2" fill="none" marker-end="url(#ao)"/>

  <!-- Block 2 decoder → Block 3 top decoder layer -->
  <path d="M 500 120 L 530 120 L 530 83 L 568 83" stroke="#1d4ed8" stroke-width="1.2" fill="none" marker-end="url(#ab)"/>

  <!-- Block 3 bottom decoder → Block 2 decoder (dashed feedback) -->
  <path d="M 580 375 L 530 375 L 530 140 L 500 140" stroke="#1d4ed8" stroke-width="1" fill="none" stroke-dasharray="5,3" marker-end="url(#ab)"/>

  <!-- ================================================================ -->
  <!-- LEGEND -->
  <!-- ================================================================ -->
  <rect x="14" y="500" width="992" height="34" rx="3" fill="#f9fafb" stroke="#e5e7eb" stroke-width="0.8"/>

  <rect x="34" y="511" width="12" height="12" rx="2" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="53" y="521" text-anchor="start" font-size="9" fill="#374151" font-weight="500">Frozen</text>
  <text x="86" y="521" font-size="8" fill="#93c5fd">&#10052;</text>

  <rect x="120" y="511" width="12" height="12" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
  <text x="139" y="521" text-anchor="start" font-size="9" fill="#374151" font-weight="500">Trainable</text>
  <text x="183" y="521" font-size="8" fill="#d97706">&#128293;</text>

  <rect x="216" y="511" width="12" height="12" rx="2" fill="#f0fdf4" stroke="#16a34a" stroke-width="0.8"/>
  <text x="235" y="521" text-anchor="start" font-size="9" fill="#374151" font-weight="500">Residual Path</text>

  <rect x="325" y="511" width="12" height="12" rx="2" fill="#fef2f2" stroke="#ef4444" stroke-width="0.8"/>
  <text x="344" y="521" text-anchor="start" font-size="9" fill="#374151" font-weight="500">Fusion Detail</text>

  <text x="980" y="521" text-anchor="end" font-size="8" fill="#9ca3af" font-style="italic">Zero-init: exact baseline at initialization</text>

</svg>

</body>
</html>
